# Keeps Atlas (our own traffic service) fresh: asks it every 5 minutes to fetch the Hong Kong speed
# feed, then checks its public status. From Atlas's own source (v11, .github/workflows/atlas-refresh.yml).
# Needs the repository secret ATLAS_REFRESH_KEY, a private ingestion credential the Atlas operator
# provisions; without it the job only prints a notice. The publishable read keys cannot refresh.
# GitHub may delay scheduled runs; the app hides Atlas whenever its data is older than 10 minutes.
name: Refresh Atlas traffic feed
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-official-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_KEY: ${{ secrets.ATLAS_REFRESH_KEY != '' }}
    steps:
      - name: No refresh key yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ATLAS_REFRESH_KEY is not set, so Atlas is not refreshed from here."
      - name: Refresh and verify
        if: env.HAS_KEY == 'true'
        env:
          ATLAS_REFRESH_KEY: ${{ secrets.ATLAS_REFRESH_KEY }}
          ATLAS_BASE_URL: ${{ vars.ATLAS_BASE_URL || 'https://atlas-traffic-command.nadav747710.chatgpt.site' }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ['ATLAS_BASE_URL'].rstrip('/')
          ua = {'User-Agent': 'Mozilla/5.0 (compatible; AtlasScheduler/2.0)'}
          req = urllib.request.Request(base + '/api/refresh', method='POST', headers={**ua, 'Authorization': 'Bearer ' + os.environ['ATLAS_REFRESH_KEY']})
          with urllib.request.urlopen(req, timeout=180) as r:
              data = json.load(r)
          if data.get('refresh_status') != 'stored_and_verified':
              raise SystemExit('Refresh was not stored and verified: ' + str(data.get('refresh_status')))
          with urllib.request.urlopen(urllib.request.Request(base + '/api/status', headers=ua), timeout=30) as r:
              status = json.load(r)
          if status.get('stale') or status.get('source_status') != 'ok':
              raise SystemExit('Source is stale or unhealthy')
          print(json.dumps({k: status.get(k) for k in ['observed_at', 'tiles_version', 'matched_segments', 'source_status']}))
          PY
