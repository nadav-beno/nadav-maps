name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly refresh of our own OpenStreetMap geodata (Mondays 03:17 UTC; Geofabrik updates daily).
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Our own search / address / reverse-geocoding / place-details data, built from the
      # OpenStreetMap extract of every region with `geodata` in packages/core/src/region.ts
      # (scripts/geodata). Rebuilt once per ISO week or when the builder changes; otherwise the
      # cached copy is used, so ordinary deploys stay fast.
      - name: Geodata cache key
        id: geokey
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore geodata
        id: geocache
        uses: actions/cache/restore@v4
        with:
          path: geodata-out
          key: geodata-v1-${{ steps.geokey.outputs.week }}-${{ hashFiles('scripts/geodata/*.ts', 'scripts/geodata/*.sh', 'packages/core/src/geoindex.ts', 'packages/core/src/hebrew.ts', 'packages/core/src/region.ts') }}
          # A miss still restores the newest older build: if this week's build fails, we deploy that one.
          restore-keys: geodata-v1-
      - name: Build geodata from OpenStreetMap
        id: geobuild
        if: steps.geocache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 60
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          osmium --version
          bash scripts/geodata/build-all.sh "$RUNNER_TEMP/geodata-new"
          rm -rf geodata-out
          mv "$RUNNER_TEMP/geodata-new" geodata-out
      - name: Save geodata
        if: steps.geocache.outputs.cache-hit != 'true' && steps.geobuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: geodata-out
          key: ${{ steps.geocache.outputs.cache-primary-key }}

      # Our own places tiles (restaurants, shops, attractions...) for the same regions, from the newest
      # monthly Overture Maps release (which merges Meta, Microsoft and Foursquare open places;
      # scripts/places). Rebuilt when Overture publishes a release or the builder changes; on failure the
      # newest older build is deployed, and with none the map reads Overture's own tiles.
      - name: Places cache key
        id: plkey
        continue-on-error: true
        run: echo "release=$(curl -fsSL --retry 3 https://stac.overturemaps.org/catalog.json | jq -r .latest)" >> "$GITHUB_OUTPUT"
      - name: Restore places
        id: plcache
        uses: actions/cache/restore@v4
        with:
          path: places-out
          key: places-v1-${{ steps.plkey.outputs.release || 'unknown' }}-${{ hashFiles('scripts/places/*', 'packages/core/src/overture.ts', 'packages/core/src/region.ts') }}
          restore-keys: places-v1-
      - name: Build places from Overture
        id: plbuild
        if: steps.plcache.outputs.cache-hit != 'true' && steps.plkey.outputs.release != ''
        continue-on-error: true
        timeout-minutes: 45
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tippecanoe
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet duckdb==1.5.6
          bash scripts/places/build-all.sh "$RUNNER_TEMP/places-new" "${{ steps.plkey.outputs.release }}"
          rm -rf places-out
          mv "$RUNNER_TEMP/places-new" places-out
      - name: Save places
        if: steps.plbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: places-out
          key: ${{ steps.plcache.outputs.cache-primary-key }}

      # The site lives at /<repository name>/ (from GITHUB_REPOSITORY, which scheduled runs have too).
      - run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" pnpm build
        env:
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          # Optional. Empty = no traffic layer. Set in Settings > Secrets and variables > Actions > Variables.
          VITE_TOMTOM_KEY: ${{ vars.VITE_TOMTOM_KEY }}
          # Optional. Empty = no HERE traffic (HERE covers Israel). Same place as above.
          VITE_HERE_KEY: ${{ vars.VITE_HERE_KEY }}
          # Optional. Empty = no Atlas (our own traffic service, Hong Kong today). Same place as above:
          # Atlas's publishable read key for https://nadav-beno.github.io.
          VITE_ATLAS_KEY: ${{ vars.VITE_ATLAS_KEY }}
      - name: Add geodata to the site
        run: |
          if ls geodata-out/*/manifest.json >/dev/null 2>&1; then
            mkdir -p apps/web/dist/data
            cp -R geodata-out/. apps/web/dist/data/
            du -sh apps/web/dist/data/*
            # Each file stays under 20 MB by construction (Pages allows 100 MB per file, 1 GB per site).
            big="$(find apps/web/dist/data -type f -size +20M)"
            if [ -n "$big" ]; then echo "::error::geodata files over 20 MB: $big"; exit 1; fi
          else
            echo "::warning::No geodata built or cached: the site falls back to Photon and Overpass."
          fi
      - name: Add places to the site
        run: |
          if ls places-out/*/places.pmtiles >/dev/null 2>&1; then
            # One range-read file per region; a file Pages would refuse (100 MB) is left out, not deployed.
            for f in places-out/*/places.pmtiles; do
              if [ "$(stat -c %s "$f")" -gt 95000000 ]; then echo "::error::$f is over 95 MB, skipped"; continue; fi
              d="apps/web/dist/data/$(basename "$(dirname "$f")")"
              mkdir -p "$d"
              cp "$f" "$(dirname "$f")/places.json" "$d/"
            done
            du -sh apps/web/dist/data/*/places.pmtiles || true
          else
            echo "::warning::No places built or cached: the map reads Overture's own tiles everywhere."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
